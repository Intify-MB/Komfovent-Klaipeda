<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Komfovent — Patalpų nuomos opcijos</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f4f6fb;
  --panel:#ffffff;
  --card:#ffffff;
  --card-hover:#f0f4ff;
  --border:#dde3f0;
  --border2:#c5cfe8;
  --accent:#1a5fd4;
  --accent-light:#e8efff;
  --accent-mid:#4a82e8;
  --warn:#e07b00;
  --danger:#d63b3b;
  --ok:#1a8c4e;
  --text:#1a2035;
  --text2:#6272a0;
  --text3:#aab4cc;
  --mono:'IBM Plex Mono',monospace;
  --sans:'IBM Plex Sans',sans-serif;
  --shadow:0 1px 3px rgba(26,45,100,.08),0 4px 12px rgba(26,45,100,.06);
  --shadow-card:0 1px 2px rgba(26,45,100,.06),0 2px 8px rgba(26,45,100,.08);
}
html,body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:13px}

/* TOPBAR */
.topbar{
  background:var(--panel);
  border-bottom:1px solid var(--border);
  padding:12px 22px;
  display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:200;gap:12px;flex-wrap:wrap;
  box-shadow:0 1px 4px rgba(26,45,100,.07);
}
.topbar-brand{font-family:var(--mono);font-size:11px;color:var(--text2);text-transform:uppercase;letter-spacing:.1em;white-space:nowrap}
.topbar-brand b{color:var(--accent)}
.topbar-filters{display:flex;gap:6px;flex-wrap:wrap}
.fbtn{
  background:transparent;border:1px solid var(--border2);
  color:var(--text2);font-family:var(--mono);font-size:10px;
  padding:4px 11px;border-radius:4px;cursor:pointer;transition:all .15s;
  text-transform:uppercase;letter-spacing:.05em;
}
.fbtn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-light)}
.fbtn.on{background:var(--accent);border-color:var(--accent);color:#fff}

/* STRIP */
.strip{
  background:var(--panel);
  border-bottom:1px solid var(--border);
  padding:14px 18px;
  display:flex;gap:10px;overflow-x:auto;
  scrollbar-width:thin;scrollbar-color:var(--border2) transparent;
}
.strip::-webkit-scrollbar{height:4px}
.strip::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}

.scard{
  flex:0 0 158px;background:var(--card);border:1px solid var(--border);
  border-radius:8px;overflow:hidden;cursor:pointer;
  transition:border-color .15s,box-shadow .15s,transform .15s;
  position:relative;box-shadow:var(--shadow-card);
}
.scard:hover{border-color:var(--accent-mid);box-shadow:0 4px 16px rgba(26,95,212,.14);transform:translateY(-1px)}
.scard.active{border-color:var(--accent)!important;box-shadow:0 0 0 2px rgba(26,95,212,.18),var(--shadow-card)}
.scard.hidden{display:none}

.scard-img{width:100%;height:86px;object-fit:cover;display:block;background:var(--border)}
.scard-img-ph{width:100%;height:86px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:9px;color:var(--text3)}
.scard-body{padding:9px 10px}
.scard-num{font-family:var(--mono);font-size:9px;color:var(--text3);margin-bottom:3px}
.scard-addr{font-size:11px;font-weight:600;color:var(--text);line-height:1.3;margin-bottom:5px}
.scard-score{font-family:var(--mono);font-size:19px;font-weight:500;line-height:1;margin-bottom:3px}
.scard-bar{height:3px;background:var(--border);border-radius:2px;margin-bottom:5px}
.scard-bar-fill{height:100%;border-radius:2px}
.scard-meta{font-family:var(--mono);font-size:9px;color:var(--text2)}
.scard-tags{display:flex;gap:3px;margin-top:6px;flex-wrap:wrap}
.stag{font-family:var(--mono);font-size:8px;padding:2px 6px;border-radius:3px;font-weight:500}
.stag-ok{background:#e6f4ed;color:var(--ok)}
.stag-no{background:#fdeaea;color:var(--danger)}

.badge{position:absolute;top:7px;right:7px;font-family:var(--mono);font-size:8px;font-weight:600;padding:2px 7px;border-radius:3px}
.badge-go{background:#e6f4ed;color:var(--ok);border:1px solid #b8dfc9}
.badge-nogo{background:#fdeaea;color:var(--danger);border:1px solid #f5c0c0}

/* DETAIL */
.detail{
  background:var(--bg);
  padding:24px 22px;
  display:none;
  border-top:3px solid var(--accent);
}
.detail.open{display:block}

.detail-header{
  display:flex;align-items:flex-start;justify-content:space-between;
  margin-bottom:22px;gap:16px;flex-wrap:wrap;
  padding-bottom:18px;border-bottom:1px solid var(--border);
}
.detail-num{font-family:var(--mono);font-size:10px;color:var(--text3);margin-bottom:5px;text-transform:uppercase;letter-spacing:.08em}
.detail-addr{font-size:22px;font-weight:700;color:var(--text);margin-bottom:4px;line-height:1.2}
.detail-loc{font-size:12px;color:var(--text2)}
.detail-score-num{font-family:var(--mono);font-size:46px;font-weight:500;line-height:1;text-align:right}
.detail-score-lbl{font-family:var(--mono);font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:.08em;text-align:right}

.detail-body{display:grid;grid-template-columns:1fr 330px;gap:24px}
@media(max-width:720px){.detail-body{grid-template-columns:1fr}.detail-right{order:-1}}

/* GALLERY */
.gallery-main{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:8px;margin-bottom:8px;background:var(--border);display:block;cursor:zoom-in;box-shadow:var(--shadow)}
.gallery-main-ph{width:100%;aspect-ratio:16/9;background:var(--panel);border-radius:8px;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:11px;color:var(--text3);margin-bottom:8px;border:1px solid var(--border)}
.gallery-thumbs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin;scrollbar-color:var(--border2) transparent}
.gallery-thumbs::-webkit-scrollbar{height:3px}
.gallery-thumb{flex:0 0 76px;height:48px;object-fit:cover;border-radius:5px;cursor:pointer;opacity:.5;border:2px solid transparent;transition:all .15s}
.gallery-thumb:hover{opacity:.85}
.gallery-thumb.active{opacity:1;border-color:var(--accent)}

/* TABLE */
.sec-lbl{
  font-family:var(--mono);font-size:9px;color:var(--text3);
  text-transform:uppercase;letter-spacing:.1em;
  border-bottom:1px solid var(--border);padding-bottom:6px;margin-bottom:10px;
}
.info-tbl{width:100%;border-collapse:collapse;margin-bottom:16px}
.info-tbl td{padding:6px 0;font-size:12px;border-bottom:1px solid var(--border)}
.info-tbl tr:last-child td{border-bottom:none}
.info-tbl td:first-child{color:var(--text2)}
.info-tbl td:last-child{text-align:right;font-family:var(--mono);font-size:11px;font-weight:500;color:var(--text)}
.v-accent{color:var(--accent)!important;font-size:13px!important;font-weight:600!important}
.v-ok{color:var(--ok)!important;font-weight:600!important}
.v-no{color:var(--danger)!important;font-weight:600!important}

.notes-box{
  background:var(--panel);border:1px solid var(--border);
  border-left:3px solid var(--accent-mid);
  border-radius:6px;padding:13px 15px;
  font-size:12px;color:var(--text2);line-height:1.75;
  box-shadow:var(--shadow-card);
}

/* SCORE BARS */
.sbar-row{margin-bottom:10px}
.sbar-top{display:flex;justify-content:space-between;margin-bottom:4px}
.sbar-name{font-family:var(--mono);font-size:9px;color:var(--text2);text-transform:uppercase;letter-spacing:.04em}
.sbar-pts{font-family:var(--mono);font-size:9px;color:var(--text2)}
.sbar-track{height:4px;background:var(--border);border-radius:2px}
.sbar-fill{height:100%;border-radius:2px;transition:width .5s .1s}

/* RIGHT PANEL */
.right-box{
  background:var(--panel);border:1px solid var(--border);
  border-radius:8px;padding:16px;margin-bottom:16px;
  box-shadow:var(--shadow-card);
}

/* MAP */
#dmap{height:240px;border-radius:6px;border:1px solid var(--border);overflow:hidden}

/* LIGHTBOX */
.lbox{display:none;position:fixed;inset:0;background:rgba(10,15,30,.94);z-index:999;align-items:center;justify-content:center}
.lbox.open{display:flex}
.lbox img{max-width:90vw;max-height:90vh;border-radius:6px;object-fit:contain;box-shadow:0 8px 40px rgba(0,0,0,.5)}
.lbox-x{position:fixed;top:18px;right:22px;color:#fff;font-size:22px;cursor:pointer;background:none;border:none;font-family:var(--mono);opacity:.7}
.lbox-x:hover{opacity:1}
.lbox-p,.lbox-n{position:fixed;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#fff;font-family:var(--mono);font-size:20px;padding:9px 14px;cursor:pointer;border-radius:5px;transition:background .15s}
.lbox-p:hover,.lbox-n:hover{background:rgba(255,255,255,.2)}
.lbox-p{left:14px}.lbox-n{right:14px}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-brand">KOMFOVENT · <b>Patalpų nuomos opcijos</b> · Klaipėda 2026–2027</div>
  <div class="topbar-filters">
    <button class="fbtn on" onclick="filt('all',this)">Visos</button>
    <button class="fbtn" onclick="filt('vilk',this)">Vilkikai ✓</button>
    <button class="fbtn" onclick="filt('ivaz',this)">Įvažiavimas ✓</button>
    <button class="fbtn" onclick="filt('plotas',this)">600–800 m²</button>
    <button class="fbtn" onclick="filt('kaina',this)">≤ €8/m²</button>
    <button class="fbtn" onclick="filt('2026',this)">2026</button>
  </div>
</div>

<div class="strip" id="strip"></div>

<div class="detail" id="detail">
  <div class="detail-header">
    <div>
      <div class="detail-num" id="d-num"></div>
      <div class="detail-addr" id="d-addr"></div>
      <div class="detail-loc" id="d-loc"></div>
    </div>
    <div>
      <div class="detail-score-num" id="d-score"></div>
      <div class="detail-score-lbl">tinkamumo score</div>
    </div>
  </div>
  <div class="detail-body">
    <div class="detail-left">
      <div id="d-gal-main"></div>
      <div class="gallery-thumbs" id="d-thumbs"></div>
      <div style="margin-top:18px">
        <div class="sec-lbl">Komercinės sąlygos</div>
        <table class="info-tbl" id="d-tbl"></table>
      </div>
      <div class="notes-box" id="d-notes"></div>
    </div>
    <div class="detail-right">
      <div class="right-box">
        <div class="sec-lbl">Score struktūra</div>
        <div id="d-bars"></div>
      </div>
      <div class="right-box" style="padding:0;overflow:hidden">
        <div style="padding:12px 14px 8px"><div class="sec-lbl" style="margin-bottom:0">Lokacija</div></div>
        <div id="dmap"></div>
      </div>
    </div>
  </div>
</div>

<div class="lbox" id="lbox" onclick="lbClose(event)">
  <button class="lbox-x" onclick="document.getElementById('lbox').classList.remove('open')">✕</button>
  <button class="lbox-p" onclick="lbNav(-1);event.stopPropagation()">‹</button>
  <img id="lbox-img" src="" alt="">
  <button class="lbox-n" onclick="lbNav(1);event.stopPropagation()">›</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const BASE='https://raw.githubusercontent.com/Intify-MB/Komfovent-Klaipeda/main/';
const D=[
  {id:1,addr:'Tilžės g. 86',loc:'Klaipėda — Verslo parkas A klasė',
   c:[55.701969,21.196916],plotas:952,k:5.50,ex:0.76,bud:5966,term:60,isi:'2027-01',
   notes:'2 vartai grindų lygio 3×4,3 m. Vilkikas įvažiuoja į vidų. ~40 m manevro zona priešais vartus. Šildymas kalorifėkliais. A klasės verslo parkas, saulės kolektoriai ant stogo.',
   iv:true,vl:true,
   ph:['Tilžės_g__86_1.JPG','Tilžės_g__86_2.JPG','Tilžės_g__86_3.JPG']},
  {id:2,addr:'Pramonės g. 33',loc:'Klaipėda — Flexi logistikos parkas',
   c:[55.682665,21.211393],plotas:1125,k:6.00,ex:0.60,bud:7425,term:60,isi:'2027-04',
   notes:'2 vartai grindų lygio 3×4,3 m. Vilkikas neįvažiuoja į vidų. ~10 m manevro zona. Naujas Flexi parko pastatas.',
   iv:false,vl:true,
   ph:['Flexi1_1.JPG','Flexi1_2.JPG','Flexi1_3.JPG','Flexi1_4.JPG','Flexi1_5.JPG','Flexi1_6.JPG','Flexi1_7.jpg']},
  {id:3,addr:'Tilžės g. 74',loc:'Klaipėda — Pramonės zona',
   c:[55.703498,21.183231],plotas:864,k:6.00,ex:0.80,bud:5875,term:60,isi:'2026-09',
   notes:'1 vartai grindų lygio 4×4,3 m. Vilkikas įvažiuoja į vidų. Ankstyviausias galimas įsikėlimas — 2026 rugsėjis.',
   iv:true,vl:true,
   ph:['Tilzes_74_1.jpg','Tilzes_74_2.jpg','Tilzes_74_3.jpg']},
  {id:4,addr:'Liepų g. 80',loc:'Klaipėda — Šiaurinė zona (naujas projektas)',
   c:[55.728784,21.180276],plotas:750,k:11.00,ex:1.00,bud:9000,term:60,isi:'2026-09',
   notes:'1 vartai grindų lygio 3×3 m. Vilkikas neįvažiuoja į vidų. Naujas statybos projektas. Aukšta kaina.',
   iv:false,vl:false,
   ph:['Liepu80_1.jpg','Liepu80_2.jpg','Liepu80_3.jpg','Liepu80_5.jpg']},
  {id:5,addr:'Pramonės g. 8',loc:'Klaipėda — Verslo parkas',
   c:[55.693801,21.194500],plotas:520,k:8.00,ex:0.80,bud:4576,term:60,isi:'2027-01',
   notes:'1 vartai grindų lygio 4×4,3 m. Vilkikas įvažiuoja į vidų. Klaipėdos verslo parkas. Plotas 520 m² — mažesnis nei poreikis.',
   iv:true,vl:true,
   ph:['Pramones_8_1.JPG','Pramones_8_2.jpg','Pramones_8_3.jpg']},
  {id:6,addr:'Plieno g. 2',loc:'Klaipėda — Pietinė pramonės zona',
   c:[55.673736,21.199270],plotas:850,k:6.00,ex:0.60,bud:5610,term:60,isi:'2027-01',
   notes:'2 vartai grindų lygio 3×4,3 m. Vilkikas įvažiuoja į vidų. Göllner Spedition kompleksas. Geras privažiavimas.',
   iv:true,vl:true,
   ph:['Plieno_2_1.JPG','Plieno_2_2.JPG','Plieno_2_3.JPG','Plieno_2_4.JPG','Plieno_g__2_5.jpg','Plieno_g__2_6.jpg']}
];

function calcScore(o){
  let s=0;
  if(o.vl)s+=30;if(o.iv)s+=25;
  if(o.k<=7)s+=20;else if(o.k<=9)s+=10;
  if(Math.abs(o.plotas-700)<=150)s+=15;else if(Math.abs(o.plotas-700)<=300)s+=8;
  if(o.isi<='2026-12')s+=10;
  return Math.min(s,100);
}
function scCol(s){return s>=75?'#1a5fd4':s>=55?'#e07b00':'#d63b3b'}
D.forEach(o=>o.score=calcScore(o));
D.sort((a,b)=>b.score-a.score);

const strip=document.getElementById('strip');
D.forEach(o=>{
  const go=o.vl&&o.iv;
  const el=document.createElement('div');
  el.className='scard';
  el.dataset.id=o.id;el.dataset.vl=o.vl;el.dataset.iv=o.iv;
  el.dataset.plotas=o.plotas;el.dataset.k=o.k;el.dataset.isi=o.isi;
  const img=o.ph.length
    ?`<img class="scard-img" src="${BASE}${encodeURIComponent(o.ph[0])}" loading="lazy" onerror="this.outerHTML='<div class=\\'scard-img-ph\\'>—</div>'">`
    :`<div class="scard-img-ph">—</div>`;
  el.innerHTML=`${img}
    <div class="badge ${go?'badge-go':'badge-nogo'}">${go?'GO':'NO GO'}</div>
    <div class="scard-body">
      <div class="scard-num">Op-0${o.id}</div>
      <div class="scard-addr">${o.addr}</div>
      <div class="scard-score" style="color:${scCol(o.score)}">${o.score}<span style="font-size:10px;color:var(--text3)">/10</span></div>
      <div class="scard-bar"><div class="scard-bar-fill" style="width:${o.score}%;background:${scCol(o.score)}"></div></div>
      <div class="scard-meta">${o.plotas} m² · €${o.k.toFixed(2)}/m²</div>
      <div class="scard-tags">
        <span class="stag ${o.vl?'stag-ok':'stag-no'}">vilk</span>
        <span class="stag ${o.iv?'stag-ok':'stag-no'}">ivaz</span>
      </div>
    </div>`;
  el.addEventListener('click',()=>openD(o.id));
  strip.appendChild(el);
});

let dmap=null,dmMarker=null,curPh=[],curIdx=0,curId=null;

function openD(id){
  if(curId===id)return;curId=id;
  const o=D.find(x=>x.id===id);
  document.querySelectorAll('.scard').forEach(c=>c.classList.toggle('active',+c.dataset.id===id));
  document.getElementById('d-num').textContent=`Op-0${o.id}`;
  document.getElementById('d-addr').textContent=o.addr;
  document.getElementById('d-loc').textContent=o.loc;
  const sEl=document.getElementById('d-score');
  sEl.textContent=o.score;sEl.style.color=scCol(o.score);
  curPh=o.ph;curIdx=0;renderGal(o,0);
  const it=(o.k+o.ex).toFixed(2);
  document.getElementById('d-tbl').innerHTML=`
    <tr><td>Plotas</td><td>${o.plotas} m²</td></tr>
    <tr><td>Nuomos kaina</td><td>€${o.k.toFixed(2)}/m²</td></tr>
    <tr><td>Eksploatacijos mokestis</td><td>€${o.ex.toFixed(2)}/m²</td></tr>
    <tr><td>Komunaliniai</td><td>pagal faktą</td></tr>
    <tr><td>Iš viso (be kom.)</td><td class="v-accent">€${it}/m²</td></tr>
    <tr><td>Biudžetas/mėn.</td><td class="v-accent">€${o.bud.toLocaleString('lt')}</td></tr>
    <tr><td>Nuomos terminas</td><td>${o.term} mėn.</td></tr>
    <tr><td>Įsikėlimas</td><td>${o.isi}</td></tr>
    <tr><td>Vilkikų privažiavimas</td><td class="${o.vl?'v-ok':'v-no'}">${o.vl?'✓ Taip':'✗ Ne'}</td></tr>
    <tr><td>Įvažiavimas į vidų</td><td class="${o.iv?'v-ok':'v-no'}">${o.iv?'✓ Taip':'✗ Ne'}</td></tr>`;
  document.getElementById('d-notes').textContent=o.notes;
  const bars=[
    {n:'Vilkikų privažiavimas',p:o.vl?30:0,m:30},
    {n:'Įvažiavimas į vidų',p:o.iv?25:0,m:25},
    {n:'Kainos atitikimas',p:o.k<=7?20:o.k<=9?10:0,m:20},
    {n:'Ploto atitikimas',p:Math.abs(o.plotas-700)<=150?15:Math.abs(o.plotas-700)<=300?8:0,m:15},
    {n:'Įsikėlimo terminas',p:o.isi<='2026-12'?10:0,m:10},
  ];
  document.getElementById('d-bars').innerHTML=bars.map(b=>{
    const pct=b.m?b.p/b.m*100:0;
    const c=b.p>=b.m?'#1a5fd4':b.p>0?'#e07b00':'#d63b3b';
    return `<div class="sbar-row">
      <div class="sbar-top"><span class="sbar-name">${b.n}</span><span class="sbar-pts">${b.p}/${b.m}</span></div>
      <div class="sbar-track"><div class="sbar-fill" style="width:${pct}%;background:${c}"></div></div>
    </div>`;
  }).join('');
  if(!dmap){
    dmap=L.map('dmap',{center:o.c,zoom:14});
    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',{attribution:'© CartoDB',maxZoom:19}).addTo(dmap);
  } else {
    dmap.setView(o.c,14);
    if(dmMarker)dmap.removeLayer(dmMarker);
  }
  const mIcon=L.divIcon({className:'',html:`<div style="background:#1a5fd4;color:#fff;font-family:'IBM Plex Mono',monospace;font-size:11px;padding:4px 9px;border-radius:4px;white-space:nowrap;box-shadow:0 2px 8px rgba(26,95,212,.35)">${o.addr}</div>`,iconAnchor:[40,14]});
  dmMarker=L.marker(o.c,{icon:mIcon}).addTo(dmap);
  document.getElementById('detail').classList.add('open');
  requestAnimationFrame(()=>dmap.invalidateSize());
}

function renderGal(o,idx){
  const m=document.getElementById('d-gal-main');
  const t=document.getElementById('d-thumbs');
  if(!o.ph.length){
    m.innerHTML=`<div class="gallery-main-ph">Nuotraukos bus pridėtos</div>`;
    t.innerHTML='';return;
  }
  m.innerHTML=`<img class="gallery-main" src="${BASE}${encodeURIComponent(o.ph[idx])}" onclick="lbOpen(${idx})" onerror="this.outerHTML='<div class=\\'gallery-main-ph\\'>Nuotrauka neprieinama</div>'">`;
  t.innerHTML=o.ph.map((p,i)=>`<img class="gallery-thumb${i===idx?' active':''}" src="${BASE}${encodeURIComponent(p)}" loading="lazy" onclick="switchPh(${i})" onerror="this.style.display='none'">`).join('');
}
function switchPh(i){const o=D.find(x=>x.id===curId);if(!o)return;curIdx=i;renderGal(o,i)}
function lbOpen(i){curIdx=i;document.getElementById('lbox-img').src=BASE+encodeURIComponent(curPh[i]);document.getElementById('lbox').classList.add('open')}
function lbClose(e){if(e.target===document.getElementById('lbox'))document.getElementById('lbox').classList.remove('open')}
function lbNav(d){curIdx=(curIdx+d+curPh.length)%curPh.length;document.getElementById('lbox-img').src=BASE+encodeURIComponent(curPh[curIdx])}
function filt(type,btn){
  document.querySelectorAll('.fbtn').forEach(b=>b.classList.remove('on'));btn.classList.add('on');
  document.querySelectorAll('.scard').forEach(c=>{
    const vl=c.dataset.vl==='true',iv=c.dataset.iv==='true';
    const pl=+c.dataset.plotas,k=+c.dataset.k,isi=c.dataset.isi;
    let show=true;
    if(type==='vilk')show=vl;else if(type==='ivaz')show=iv;
    else if(type==='plotas')show=pl>=600&&pl<=800;else if(type==='kaina')show=k<=8;
    else if(type==='2026')show=isi<='2026-12';
    c.classList.toggle('hidden',!show);
  });
}
openD(D[0].id);
</script>
